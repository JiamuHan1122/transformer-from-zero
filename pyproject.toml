[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-from-zero"
version = "0.1.0"
description = "A one-year from-scratch Transformer learning project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "exercise: deliberate red tests for exercises not yet completed",
]
# Default only checks runnable infrastructure. Call '-m exercise' for practice.
addopts = "-m 'not exercise'"
