<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
<title id="title">Day 15 Encoder Block — Pre-LN and Post-LN</title>
<desc id="desc">Two precise flow diagrams: Pre-LN applies LayerNorm before each sublayer and adds the skip connection afterward; Post-LN applies each LayerNorm after a residual addition. Attention, FFN and both skip connections are shown separately.</desc>
