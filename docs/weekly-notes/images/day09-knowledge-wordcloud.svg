<title id="title">Day 09 Knowledge Word Cloud — Masked Attention</title>
<desc id="desc">Academic word cloud matching the Day 08 series: white canvas, compact project header, varied keyword sizes, the same navy, blue, green, purple, teal and orange palette, and a concise completion footer. Main concepts are Causal Mask, Padding Mask, Masked Softmax, Autoregressive Attention, Broadcasting, Numerical Stability and Future-Token Isolation.</desc>
